<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Suivi santé</title>
  <style>
    :root {
      --bg: #f4f6f8; --card: #fff; --text: #1f2933; --muted: #6b7785; --line: #e3e7eb;
      --accent: #0f766e; --accent-soft: #e0f2f1; --warn: #d97706; --warn-soft: #fef3c7; --ok: #15803d; --danger: #b91c1c;
      --cols: minmax(0, 1fr) 18px 48px 36px 18px 44px 44px 16px;
      --gap: 3px;
      --pad: 8px;
      --fs: 12.5px;
    }
    @media (max-width: 339px) {
      :root { --cols: minmax(0, 1fr) 16px 40px 30px 16px 38px 38px 12px; --gap: 2px; --pad: 6px; --fs: 11px; }
    }
    @media (min-width: 480px) {
      :root { --cols: minmax(0, 1fr) 30px 70px 48px 30px 64px 64px 30px; --gap: 8px; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .top { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
    .bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
    .bar h1 { font-size: 17px; margin: 0; flex: 1; }
    .seg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 2px; }
    .seg button, .seg label { border: 0; background: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    .seg button[aria-pressed="true"], .seg input:checked + span { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
    .seg .count { background: var(--warn); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 700; }
    .icon-btn { border: 0; background: none; width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; position: relative; color: var(--muted); }
    .icon-btn svg { width: 20px; height: 20px; }
    .drive-chip { border: 1px solid var(--line); background: var(--bg); border-radius: 16px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
    .drive-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa5b1; }
    .drive-chip.on { background: #dcfce7; border-color: #bbf7d0; color: var(--ok); } .drive-chip.on .dot { background: var(--ok); }
    .drive-chip.busy { background: var(--warn-soft); border-color: #fde68a; color: #92400e; } .drive-chip.busy .dot { background: var(--warn); }
    .drive-chip.off { color: var(--danger); } .drive-chip.off .dot { background: var(--danger); }

    .search { display: flex; gap: 6px; align-items: center; padding: 0 var(--pad) 6px; }
    .search input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--bg); font-size: 16px; }
    .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: #fff; }
    .grid { display: grid; grid-template-columns: var(--cols); column-gap: var(--gap); align-items: start; padding: 0 var(--pad); }
    .thead { font-size: 10px; color: var(--muted); font-weight: 600; white-space: nowrap; padding-top: 4px; padding-bottom: 5px; }
    .thead span:not(:first-child), .row > span { text-align: center; }
    .thead .r, .row .num { text-align: right; }

    main { padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
    .year { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 10px 4px; font-weight: 700; color: var(--muted); font-size: 13px; }
    .year small { font-weight: 500; }
    .row { background: var(--card); border-bottom: 1px solid var(--line); padding-top: 9px; padding-bottom: 9px; font-size: var(--fs); font-variant-numeric: tabular-nums; cursor: pointer; }
    .row:active { background: var(--accent-soft); }
    .row.todo { box-shadow: inset 3px 0 0 var(--warn); }
    .motif { min-width: 0; }
    .motif b { display: block; font-weight: 600; font-size: calc(var(--fs) + 1px); overflow-wrap: anywhere; }
    .motif small { display: block; color: var(--muted); font-size: calc(var(--fs) - 1px); margin-top: 1px; overflow-wrap: anywhere; }
    .ini { font-weight: 600; color: var(--accent); }
    .date { color: var(--muted); }
    .miss { color: var(--warn); font-weight: 700; }
    .wait { color: var(--muted); }
    .ok { color: var(--ok); font-weight: 700; }
    .empty { text-align: center; color: var(--muted); padding: 48px 20px; }

    .fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.25); display: grid; place-items: center; }
    .fab svg { width: 28px; height: 28px; }

    dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: min(560px, 100vw); max-height: 94vh; overflow: hidden; border-radius: 16px 16px 0 0; background: var(--card); color: var(--text); }
    dialog.sheet::backdrop { background: rgba(15, 23, 42, .45); }
    @media (min-width: 600px) { dialog.sheet { margin: auto; border-radius: 16px; } }
    .sheet > form, .sheet > .body { display: flex; flex-direction: column; max-height: 94vh; }
    .sheet-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 6px 16px; }
    .sheet-head h2 { flex: 1; font-size: 16px; margin: 0; }
    .sheet-body { overflow-y: auto; overflow-x: hidden; padding: 4px 16px 12px; display: grid; gap: 12px; }
    .sheet-foot { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }

    .field { display: grid; gap: 4px; }
    .field > span, .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
    .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
    .field { min-width: 0; }
    input[type="text"], input[type="date"], textarea { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: #fff; font-size: 16px; min-height: 44px; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    textarea { resize: vertical; min-height: 44px; }
    .with-btn { display: flex; gap: 6px; }
    .with-btn input { flex: 1; min-width: 0; }
    .mini { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0 12px; min-height: 44px; font-size: 14px; white-space: nowrap; }
    .missing input[type="text"], .missing input[type="date"] { border-color: var(--warn); background: var(--warn-soft); }
    .missing > span { color: var(--warn); }
    .sep { border-top: 1px dashed var(--line); margin: 2px 0; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips label, .chips button { border: 1px solid var(--line); border-radius: 18px; padding: 7px 12px; background: #fff; font-size: 14px; display: inline-flex; }
    .chips input, .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .chips label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .chips button { color: var(--muted); border-style: dashed; }
    .seg.full { display: flex; }
    .seg.full label { flex: 1; justify-content: center; padding: 0; position: relative; }
    .seg.full label span { display: block; width: 100%; text-align: center; padding: 9px 4px; border-radius: 8px; }

    .btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; font-size: 15px; }
    .btn-primary { background: var(--accent); color: #fff; flex: 1; }
    .btn-light { background: var(--bg); }
    .btn-danger { background: none; color: var(--danger); }
    .error { color: var(--danger); font-size: 13px; min-height: 0; }

    .set-section { display: grid; gap: 8px; }
    .set-section h3 { font-size: 13px; margin: 6px 0 0; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    .people { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .people li { display: flex; gap: 6px; align-items: center; }
    .people li input { flex: 1; }
    .hint { color: var(--muted); font-size: 13px; margin: 0; }
    .file-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; }
    .file-btn input { position: absolute; inset: 0; opacity: 0; }
    #importText { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: 13px ui-monospace, Consolas, monospace; resize: vertical; }

    .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: #1f2933; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; z-index: 20; max-width: 90vw; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .test-banner { background: var(--warn-soft); color: #92400e; text-align: center; font-size: 12px; padding: 3px; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none"/></symbol>
  </svg>

  <header class="top">
    <div class="test-banner" id="testBanner" hidden>Mode test : données fictives, rien n’est enregistré</div>
    <div class="bar">
      <h1>Santé</h1>
      <button type="button" class="drive-chip off" id="driveChip"><span class="dot"></span><span id="driveChipLabel">Non connecté</span></button>
      <button type="button" class="icon-btn" id="settingsBtn" aria-label="Réglages"><svg><use href="#i-menu"/></svg></button>
    </div>
    <div class="search">
      <input type="search" id="searchInput" placeholder="Rechercher…" autocomplete="off" aria-label="Rechercher (motif, personne, montant, date)">
      <div class="seg" role="group" aria-label="Filtre">
        <button type="button" data-filter="todo" aria-pressed="true">À compléter <span class="count" id="todoCount"></span></button>
        <button type="button" data-filter="all" aria-pressed="false">Tout</button>
      </div>
    </div>
    <div class="grid thead" aria-hidden="true">
      <span>Motif</span><span>Pour</span><span class="r">€</span><span>Date</span><span>Payé</span><span class="r">Sécu</span><span class="r">Mut.</span><span>Rev</span>
    </div>
  </header>

  <main id="list"></main>

  <button type="button" class="fab" id="fab" aria-label="Ajouter un soin"><svg><use href="#i-plus"/></svg></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog class="sheet" id="editSheet" aria-labelledby="editTitle">
    <form id="form" novalidate>
      <div class="sheet-head">
        <h2 id="editTitle">Soin</h2>
        <button type="button" class="icon-btn" data-close autofocus aria-label="Fermer"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet-body">
        <label class="field"><span>Motif</span><input type="text" id="fMotif" list="motifList" autocomplete="off" maxlength="120"></label>
        <datalist id="motifList"></datalist>
        <div class="two">
          <label class="field"><span>Montant €</span><input type="text" id="fAmount" inputmode="decimal" autocomplete="off"></label>
          <label class="field"><span>Date</span><input type="date" id="fDate"></label>
        </div>
        <div class="field"><span class="lbl">Pour</span><div class="chips" id="patientPick"></div></div>
        <div class="field"><span class="lbl">Payé par</span><div class="chips" id="payerPick"></div></div>
        <div class="sep"></div>
        <div class="two">
          <div class="field" id="secuField"><span>Sécu remboursé €</span>
            <div class="with-btn"><input type="text" id="fSecu" inputmode="decimal" autocomplete="off" aria-label="Sécu remboursé"><button type="button" class="mini" data-zero="fSecu" title="Pas de remboursement">–</button></div>
          </div>
          <div class="field" id="mutField"><span>Mutuelle remb. €</span>
            <div class="with-btn"><input type="text" id="fMutuelle" inputmode="decimal" autocomplete="off" aria-label="Mutuelle remboursé"><button type="button" class="mini" data-zero="fMutuelle" title="Pas de remboursement">–</button></div>
          </div>
        </div>
        <div class="field"><span class="lbl">Transmis à la mutuelle par</span>
          <div class="seg full">
            <label><input type="radio" name="transmission" value=""><span>—</span></label>
            <label><input type="radio" name="transmission" value="secu"><span>Sécu</span></label>
            <label><input type="radio" name="transmission" value="us"><span>Nous</span></label>
          </div>
        </div>
        <div class="field"><span>Émis le</span>
          <div class="with-btn"><input type="date" id="fMutuelleDate" aria-label="Émis le"><button type="button" class="mini" id="todayBtn">Aujourd’hui</button></div>
        </div>
        <div class="field" id="revField"><span class="lbl">Reversé</span>
          <div class="seg full">
            <label><input type="radio" name="reversement" value="na"><span>Pas besoin</span></label>
            <label><input type="radio" name="reversement" value="todo"><span>À faire</span></label>
            <label><input type="radio" name="reversement" value="done"><span>Fait</span></label>
          </div>
        </div>
        <label class="field"><span>Infos</span><textarea id="fNotes" rows="2" maxlength="500"></textarea></label>
        <div class="error" id="formError" role="alert"></div>
      </div>
      <div class="sheet-foot">
        <button type="button" class="btn btn-danger" id="deleteBtn" aria-label="Supprimer"><svg width="20" height="20"><use href="#i-trash"/></svg></button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="settingsSheet" aria-labelledby="settingsTitle">
    <div class="body">
      <div class="sheet-head">
        <h2 id="settingsTitle">Réglages</h2>
        <button type="button" class="icon-btn" data-close autofocus aria-label="Fermer"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet-body">
        <section class="set-section">
          <h3>Personnes</h3>
          <ul class="people" id="peopleList"></ul>
          <form class="with-btn" id="addPersonForm">
            <input type="text" id="addPersonInput" placeholder="Prénom" maxlength="40" autocomplete="off" aria-label="Nouvelle personne">
            <button type="submit" class="mini">Ajouter</button>
          </form>
        </section>
        <section class="set-section">
          <h3>Google Drive</h3>
          <p class="hint"><strong id="driveStatus"></strong> — <span id="driveMessage"></span></p>
          <div class="with-btn">
            <button type="button" class="btn btn-light" id="driveConnectBtn" style="flex:1">Se connecter</button>
            <button type="button" class="btn btn-light" id="driveDisconnectBtn">Déconnecter</button>
          </div>
        </section>
        <section class="set-section">
          <h3>Données</h3>
          <label class="btn btn-light file-btn">Importer un fichier Excel<input type="file" id="importFile" accept=".xlsx,.csv,.txt"></label>
          <textarea id="importText" rows="3" placeholder="…ou collez ici des lignes copiées depuis Excel" aria-label="Lignes copiées depuis Excel"></textarea>
          <button type="button" class="btn btn-light" id="importTextBtn">Importer les lignes collées</button>
          <div class="with-btn">
            <button type="button" class="btn btn-light" id="exportBtn" style="flex:1">Sauvegarder (JSON)</button>
            <label class="btn btn-light file-btn" style="flex:1">Restaurer<input type="file" id="restoreFile" accept=".json,application/json"></label>
          </div>
          <button type="button" class="btn btn-light" id="wipeBtn" style="color:var(--danger)">Tout supprimer</button>
        </section>
      </div>
    </div>
  </dialog>

  <script>
    'use strict';
    const TEST_MODE = new URLSearchParams(location.search).get('test') === '1';
    const STORAGE_KEY = 'trackspend-sante-v1';
    const DRIVE_ENABLED_KEY = 'trackspend-drive-enabled-v1';
    const LAST_PAYER_KEY = 'trackspend-last-payer-v1';
    const GOOGLE_CLIENT_ID = '696227301244-ahr3gp4fbn7lhc9jpe507raubbsc22o8.apps.googleusercontent.com';
    const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive';
    const DRIVE_FILE_NAME = 'suivi-depenses-sante.json';

    const $ = id => document.getElementById(id);
    const pad = value => String(value).padStart(2, '0');
    const round2 = value => Math.round(value * 100) / 100;
    const has = value => value !== null && value !== undefined;
    const norm = value => String(value ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    function isoDate(date = new Date()) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    const shortDate = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}` : '';

    function num(value) {
      if (!has(value)) return '';
      if (value === 0) return '–';
      return value.toLocaleString('fr-FR', Number.isInteger(value) ? {} : { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    const euro = value => `${round2(value) === 0 ? '0' : num(round2(value))} €`;

    function parseAmount(value) {
      if (!has(value)) return null;
      if (typeof value === 'number') return Number.isFinite(value) ? round2(value) : null;
      const text = String(value).replace(/[\s\u00a0\u202f€]/g, '').replace(',', '.');
      if (!/^-?(\d+\.?\d*|\.\d+)$/.test(text)) return null;
      return round2(Number(text));
    }

    /* ---------- Données ---------- */
    function emptyData() {
      return { version: 1, ts: 0, people: [], motifs: [], expenses: [], deleted: {} };
    }

    function isData(value) {
      return value && typeof value === 'object' && Array.isArray(value.people) && Array.isArray(value.expenses);
    }

    function normalizeData(value) {
      return {
        version: 1,
        ts: Number(value.ts) || 0,
        people: value.people.filter(p => p && typeof p.id === 'string' && typeof p.name === 'string'),
        motifs: Array.isArray(value.motifs) ? value.motifs.filter(m => m && typeof m.id === 'string') : [],
        expenses: value.expenses.filter(e => e && typeof e.id === 'string'),
        deleted: value.deleted && typeof value.deleted === 'object' ? { ...value.deleted } : {}
      };
    }

    function loadData() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (isData(stored)) return normalizeData(stored);
      } catch (error) {
        console.error('[Suivi santé] Lecture des données locales impossible', error);
      }
      return emptyData();
    }

    function mergeData(a, b) {
      const deleted = { ...a.deleted };
      Object.entries(b.deleted || {}).forEach(([id, ts]) => { deleted[id] = Math.max(deleted[id] || 0, Number(ts) || 0); });
      const mergeList = (x, y) => {
        const byId = new Map();
        [...x, ...y].forEach(record => {
          const current = byId.get(record.id);
          if (!current || (record.updatedAt || 0) > (current.updatedAt || 0)) byId.set(record.id, record);
        });
        return [...byId.values()].filter(record => !(deleted[record.id] >= (record.updatedAt || 0)));
      };
      return {
        version: 1,
        ts: Math.max(a.ts || 0, b.ts || 0),
        people: mergeList(a.people, b.people),
        motifs: mergeList(a.motifs || [], b.motifs || []),
        expenses: mergeList(a.expenses, b.expenses),
        deleted
      };
    }

    function buildTestData() {
      const now = Date.now();
      const people = ['Camille', 'Louis', 'Emma', 'Léo', 'Compte joint'].map((name, i) => ({ id: `p${i + 1}`, name, updatedAt: now }));
      const rows = [
        ['Ostéo', 'p3', 60, '2026-10-28', 'p5', null, '', null, '', 'na', ''],
        ['Dentiste détartrage', 'p1', 60, '2026-10-20', 'p1', 42, 'secu', null, '', 'na', 'Feuille envoyée'],
        ['Pédiatre vaccin', 'p4', 35, '2026-10-02', 'p5', 24.5, 'secu', 10.5, '2026-10-15', 'na', ''],
        ['Lunettes', 'p2', 380.4, '2026-09-14', 'p2', 0.09, 'us', 200, '2026-09-30', 'todo', 'Devis transmis'],
        ['Kiné 5 séances genou', 'p1', 82, '2026-08-03', 'p5', 49.2, 'secu', 32.8, '2026-08-20', 'done', ''],
        ['Pharmacie', 'p3', 24.6, '2025-12-12', 'p5', 16, 'secu', 8.6, '2025-12-28', 'na', ''],
        ['Médecin généraliste', 'p2', 30, '2025-11-05', 'p2', 20, 'secu', 10, '2025-11-20', 'done', '']
      ];
      const expenses = rows.map(([motif, patient, amount, date, payer, secu, transmission, mutuelle, mutuelleDate, reversement, notes], i) => ({
        id: `t${i + 1}`, type: '', motif, patient, amount, date, payer, secu, transmission, mutuelle, mutuelleDate, reversement, notes,
        closed: false, createdAt: now, updatedAt: now
      }));
      return { version: 1, ts: now, people, motifs: [], expenses, deleted: {} };
    }

    let data = TEST_MODE ? buildTestData() : loadData();
    let filter = 'todo';

    function persist() {
      data.ts = Date.now();
      if (!TEST_MODE) localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function save() {
      persist();
      render();
      scheduleSync();
    }

    /* ---------- Statut ---------- */
    function status(e) {
      const secu = has(e.secu);
      const mut = has(e.mutuelle);
      const rev = e.reversement !== 'todo';
      return { secu, mut, rev, done: Boolean(e.closed) || (secu && mut && rev) };
    }

    const rest = e => has(e.amount) ? round2(e.amount - (e.secu || 0) - (e.mutuelle || 0)) : 0;
    const motifText = e => [e.type, e.motif].filter(Boolean).join(' – ');
    const personName = id => (data.people.find(p => p.id === id) || {}).name || '';
    const sortedPeople = () => data.people.slice().sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    const byDateDesc = (a, b) => (b.date || '9999').localeCompare(a.date || '9999') || (b.createdAt || 0) - (a.createdAt || 0);

    // Initiale du prénom ; « CJ » pour un compte joint (« Compte joint », « CJ Renelo »…).
    function shortNames() {
      const map = {};
      data.people.forEach(p => {
        const name = p.name.trim();
        const first = name.split(/\s+/)[0] || '';
        map[p.id] = norm(name).startsWith('compte joint') ? 'CJ'
          : /^[A-Z]{2,3}$/.test(first) ? first
          : first.charAt(0).toUpperCase();
      });
      return map;
    }

    function matchesSearch(e) {
      const query = norm($('searchInput').value);
      if (!query) return true;
      return norm([motifText(e), e.notes, personName(e.patient), personName(e.payer), e.amount, num(e.amount), e.date, shortDate(e.date),
        e.date ? `${shortDate(e.date)}/${e.date.slice(0, 4)}` : '', shortDate(e.mutuelleDate)].join(' ')).includes(query);
    }

    /* ---------- Liste ---------- */
    function cell(value, missing, waiting) {
      if (has(value)) return `<span class="num">${num(value)}</span>`;
      if (waiting) return '<span class="num wait" title="Transmis, en attente">…</span>';
      return missing ? '<span class="num miss" title="À compléter">?</span>' : '<span></span>';
    }

    function rowHtml(e, short) {
      const s = status(e);
      const infos = [
        e.transmission === 'secu' ? 'Transmis sécu' : e.transmission === 'us' ? 'Transmis par nous' : '',
        e.mutuelleDate ? `Émis ${shortDate(e.mutuelleDate)}` : '',
        e.notes || ''
      ].filter(Boolean).join(' · ');
      const rev = e.reversement === 'done' ? '<span class="ok" title="Reversé">✓</span>'
        : e.reversement === 'todo' ? '<span class="miss" title="À reverser">!</span>' : '<span></span>';
      return `<div class="grid row${s.done ? '' : ' todo'}" data-id="${escapeHtml(e.id)}" role="button" tabindex="0">
        <div class="motif"><b>${escapeHtml(motifText(e) || 'Sans motif')}</b>${infos ? `<small>${escapeHtml(infos)}</small>` : ''}</div>
        <span class="ini" title="${escapeHtml(personName(e.patient))}">${escapeHtml(short[e.patient] || '')}</span>
        <span class="num">${num(e.amount)}</span>
        <span class="date">${shortDate(e.date)}</span>
        <span class="ini" title="${escapeHtml(personName(e.payer))}">${escapeHtml(short[e.payer] || '')}</span>
        ${cell(e.secu, !e.closed, false)}
        ${cell(e.mutuelle, !e.closed, Boolean(e.transmission))}
        ${rev}
      </div>`;
    }

    function render() {
      const short = shortNames();
      const todo = data.expenses.filter(e => !status(e).done);
      $('todoCount').textContent = todo.length;
      $('todoCount').hidden = !todo.length;
      document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === filter)));
      const base = filter === 'todo' ? todo : data.expenses;
      const list = base.filter(matchesSearch).sort(byDateDesc);
      if (!list.length) {
        const message = base.length ? 'Aucun résultat.' : filter === 'todo' && data.expenses.length ? 'Tout est à jour ✓' : 'Aucun soin. Touchez + pour en ajouter un.';
        $('list').innerHTML = `<div class="empty">${message}</div>`;
        return;
      }
      const groups = new Map();
      list.forEach(e => {
        const year = (e.date || '').slice(0, 4) || 'Sans date';
        if (!groups.has(year)) groups.set(year, []);
        groups.get(year).push(e);
      });
      $('list').innerHTML = [...groups].map(([year, items]) => {
        const spent = items.reduce((sum, e) => sum + (e.amount || 0), 0);
        const left = items.reduce((sum, e) => sum + rest(e), 0);
        return `<div class="year"><span>${escapeHtml(year)}</span><small>${euro(spent)} · reste ${euro(left)}</small></div>`
          + items.map(e => rowHtml(e, short)).join('');
      }).join('');
    }

    let toastTimer = 0;
    function showToast(message) {
      $('toast').textContent = message;
      $('toast').classList.add('show');

      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2400);

    /* ---------- Feuilles + bouton retour Android ---------- */
    const sheetStack = [];
    let skipPop = 0;

    function openSheet(dialog) {
      dialog.showModal();
      sheetStack.push(dialog);
      history.pushState({ sheet: dialog.id }, '');
    }

    document.querySelectorAll('dialog.sheet').forEach(dialog => {
      dialog.addEventListener('close', () => {
        const index = sheetStack.indexOf(dialog);
        if (index < 0) return;
        sheetStack.splice(index, 1);
        skipPop++;
        history.back();
      });
      dialog.addEventListener('click', event => {
        if (event.target === dialog) dialog.close();
      });
    });

    window.addEventListener('popstate', () => {
      if (skipPop > 0) { skipPop--; return; }
      const top = sheetStack.pop();
      if (top && top.open) top.close();
    });

    /* ---------- Formulaire ---------- */
    let editingId = null;
    const amountToInput = value => has(value) ? String(value).replace('.', ',') : '';
    const radioValue = name => (document.querySelector(`#form input[name="${name}"]:checked`) || {}).value || '';

      document.querySelectorAll(`#form input[name="${name}"]`).forEach(input => { input.checked = input.value === value; });

    function renderPick(name, selected) {
      $(`${name}Pick`).innerHTML = sortedPeople().map(p =>
        `<label><input type="radio" name="${name}" value="${escapeHtml(p.id)}"${p.id === selected ? ' checked' : ''}><span>${escapeHtml(p.name)}</span></label>`).join('')

    function markMissing() {

    function openEdit(id) {

      $('fNotes').value = e ? e.notes || '' : '';
      const lastPayer = localStorage.getItem(LAST_PAYER_KEY) || '';
      renderPick('patient', e ? e.patient : '');

      setRadio('transmission', e ? e.transmission || '' : '');

      $('formError').textContent = '';

      markMissing();

      $('form').querySelector('.sheet-body').scrollTop = 0;

    $('form').addEventListener('input', markMissing);
    $('form').addEventListener('change', markMissing);

    document.querySelectorAll('[data-zero]').forEach(button => button.addEventListener('click', () => {
      $(button.dataset.zero).value = '0';
      markMissing();
    }));
    $('todayBtn').addEventListener('click', () => { $('fMutuelleDate').value = isoDate(); });

    $('form').addEventListener('submit', event => {
      event.preventDefault();
      const invalid = [['fAmount', 'Montant'], ['fSecu', 'Sécu'], ['fMutuelle', 'Mutuelle']]
        .find(([id]) => $(id).value.trim() !== '' && parseAmount($(id).value) === null);
      const values = {
        type: '',
        motif: $('fMotif').value.trim(),
        patient: radioValue('patient'),
        payer: radioValue('payer'),
        date: $('fDate').value,
        amount: parseAmount($('fAmount').value),
        secu: parseAmount($('fSecu').value),
        transmission: radioValue('transmission'),
        mutuelle: parseAmount($('fMutuelle').value),
        mutuelleDate: $('fMutuelleDate').value,
        reversement: radioValue('reversement') || 'na',
        notes: $('fNotes').value.trim()
      };
      if (!values.motif) { $('formError').textContent = 'Indiquez le motif.'; $('fMotif').focus(); return; }
      if (invalid) { $('formError').textContent = `Montant invalide : ${invalid[1]}.`; $(invalid[0]).focus(); return; }
      const now = Date.now();
      const existing = editingId && data.expenses.find(x => x.id === editingId);
      if (existing) Object.assign(existing, values, { updatedAt: now });
      else data.expenses.push({ id: uid(), closed: false, createdAt: now, updatedAt: now, ...values });
      if (!TEST_MODE && values.payer) localStorage.setItem(LAST_PAYER_KEY, values.payer);
      save();
      $('editSheet').close();
      showToast(status(existing || values).done ? 'Enregistré · complet ✓' : 'Enregistré');
    });

    $('deleteBtn').addEventListener('click', () => {
      if (!editingId || !confirm('Supprimer ce soin ?')) return;
      data.expenses = data.expenses.filter(x => x.id !== editingId);
      data.deleted[editingId] = Date.now();

      $('editSheet').close();
      showToast('Soin supprimé');
    });

    function addPerson(rawName) {
      const name = String(rawName || '').trim();
      if (!name) return null;
      if (data.people.some(p => norm(p.name) === norm(name))) {
        showToast('Cette personne existe déjà');
        return null;
      }
      const person = { id: uid(), name, updatedAt: Date.now() };
      data.people.push(person);
      save();
      return person;
    }

    /* ---------- Réglages ---------- */
    function renderPeople() {
      const people = sortedPeople();
      $('peopleList').innerHTML = people.length ? people.map(p => `<li>
          <input type="text" value="${escapeHtml(p.name)}" maxlength="40" data-person-id="${escapeHtml(p.id)}" aria-label="Nom de ${escapeHtml(p.name)}">
          <button type="button" class="icon-btn" data-remove-person="${escapeHtml(p.id)}" aria-label="Supprimer ${escapeHtml(p.name)}"><svg><use href="#i-trash"/></svg></button>
        </li>`).join('') : '<li class="hint">Aucune personne.</li>';

    $('addPersonForm').addEventListener('submit', event => {

    $('peopleList').addEventListener('change', event => {
      const input = event.target.closest('input[data-person-id]');

      if (!person) return;
      const name = input.value.trim();
      if (!name || data.people.some(p => p.id !== person.id && norm(p.name) === norm(name))) {
        input.value = person.name;
        showToast(name ? 'Ce nom existe déjà' : 'Le nom ne peut pas être vide');

      person.name = name;

      save();

    function removePerson(id) {
      const person = data.people.find(p => p.id === id);
      if (!person) return;
      const used = data.expenses.filter(e => e.patient === id || e.payer === id).length;
      if (used) { showToast(`${person.name} est utilisé(e) dans ${used} soin(s)`); return; }
      if (!confirm(`Supprimer ${person.name} ?`)) return;
      data.people = data.people.filter(p => p.id !== id);
      data.deleted[id] = Date.now();
      save();
      renderPeople();
    }

    /* ---------- Interactions ---------- */
    document.addEventListener('click', event => {

      if (!target) return;
      const ds = target.dataset;
      if (ds.id) openEdit(ds.id);
      else if (ds.filter) { filter = ds.filter; render(); window.scrollTo({ top: 0 }); }
      else if (ds.close !== undefined) target.closest('dialog').close();

      else if (ds.addPerson) {

        const payer = ds.addPerson === 'payer' ? person.id : radioValue('payer');

        renderPick('payer', payer);
      }

    document.addEventListener('keydown', event => {
      const row = event.target.closest && event.target.closest('.row[data-id]');
      if (row && (event.key === 'Enter' || event.key === ' ')) {

      }
    });

    $('fab').addEventListener('click', () => openEdit(null));

    /* ---------- Sauvegarde JSON ---------- */
    $('exportBtn').addEventListener('click', () => {
      const link = document.createElement('a');

    $('restoreFile').addEventListener('change', async event => {
      const file = event.target.files[0];

        const parsed = JSON.parse(await file.text());

    /* ---------- Import Excel ---------- */
    $('wipeBtn').addEventListener('click', () => {

      if (!count && !data.people.length) { showToast('Aucune donnée à supprimer'); return; }
      if (!confirm(`Supprimer définitivement ${count} soin(s) et ${data.people.length} personne(s) ? Action irréversible.`)) return;
      const now = Date.now();
      // Les marqueurs de suppression propagent l'effacement aux autres appareils via Drive.
      [...data.expenses, ...data.people].forEach(record => { data.deleted[record.id] = now; });
      data.expenses = [];
      data.people = [];
      save();
      renderPeople();
      showToast('Toutes les données ont été supprimées');
    });

    async function readZipEntries(buffer, wanted) {
      const view = new DataView(buffer);
      const bytes = new Uint8Array(buffer);
      let eocd = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
        if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error('Fichier Excel invalide.');
      const count = view.getUint16(eocd + 10, true);
      let p = view.getUint32(eocd + 16, true);
      const decoder = new TextDecoder();
      const files = {};
      for (let n = 0; n < count && view.getUint32(p, true) === 0x02014b50; n++) {
        const method = view.getUint16(p + 10, true);
        const size = view.getUint32(p + 20, true);
        const nameLength = view.getUint16(p + 28, true);
        const local = view.getUint32(p + 42, true);
        const name = decoder.decode(bytes.subarray(p + 46, p + 46 + nameLength));
        p += 46 + nameLength + view.getUint16(p + 30, true) + view.getUint16(p + 32, true);
        if (!wanted(name)) continue;
        const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
        const raw = bytes.subarray(start, start + size);
        if (method === 0) files[name] = decoder.decode(raw);
        else if (method === 8) {
          const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
          files[name] = decoder.decode(await new Response(stream).arrayBuffer());
        }
      }
      return files;
    }

    function columnIndex(letters) {
      return [...letters.toUpperCase()].reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0) - 1;
    }

    async function parseXlsx(buffer) {
      const files = await readZipEntries(buffer, name => name.startsWith('xl/') && name.endsWith('.xml') || name.endsWith('.rels'));
      const xml = text => new DOMParser().parseFromString(text, 'application/xml');
      const shared = files['xl/sharedStrings.xml'] ? [...xml(files['xl/sharedStrings.xml']).getElementsByTagName('si')]
        .map(si => [...si.getElementsByTagName('t')].filter(t => t.parentNode === si || t.parentNode.localName === 'r').map(t => t.textContent).join('')) : [];
      let sheetPath = 'xl/worksheets/sheet1.xml';
      if (files['xl/workbook.xml'] && files['xl/_rels/workbook.xml.rels']) {
        const first = xml(files['xl/workbook.xml']).getElementsByTagName('sheet')[0];
        const rid = first && first.getAttribute('r:id');
        const rel = [...xml(files['xl/_rels/workbook.xml.rels']).getElementsByTagName('Relationship')].find(r => r.getAttribute('Id') === rid);
        if (rel) {
          const target = rel.getAttribute('Target');
          sheetPath = target.startsWith('/') ? target.slice(1) : `xl/${target}`;
        }
      }
      if (!files[sheetPath]) throw new Error('Feuille Excel introuvable.');
      return [...xml(files[sheetPath]).getElementsByTagName('row')].map(row => {
        const cells = [];
        [...row.getElementsByTagName('c')].forEach(c => {
          const ref = (c.getAttribute('r') || '').replace(/\d+/g, '');
          const col = ref ? columnIndex(ref) : cells.length;
          const type = c.getAttribute('t');
          const v = c.getElementsByTagName('v')[0];
          let value = '';
          if (type === 's') value = v ? shared[Number(v.textContent)] ?? '' : '';
          else if (type === 'inlineStr') value = [...c.getElementsByTagName('t')].map(t => t.textContent).join('');
          else if (type === 'str' || type === 'e' || type === 'b') value = v ? v.textContent : '';
          else value = v && v.textContent !== '' ? Number(v.textContent) : '';
          cells[col] = value;
        });
        return Array.from(cells, c => c ?? '');
      });
    }

    function parseDelimited(text) {
      const separator = text.includes('\t') ? '\t' : text.includes(';') ? ';' : ',';
      const rows = [];
      let row = [];
      let value = '';
      let quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"' && text[i + 1] === '"') { value += '"'; i++; }
          else if (ch === '"') quoted = false;
          else value += ch;
        } else if (ch === '"' && value === '') quoted = true;
        else if (ch === separator) { row.push(value); value = ''; }
        else if (ch === '\n' || ch === '\r') {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(value); rows.push(row); row = []; value = '';
        } else value += ch;
      }
      if (value !== '' || row.length) { row.push(value); rows.push(row); }
      return rows;
    }

    function parseDateValue(value) {
      if (typeof value === 'number') {
        if (value < 20000 || value > 80000) return '';
        return new Date(Date.UTC(1899, 11, 30) + Math.round(value) * 86400000).toISOString().slice(0, 10);
      }
      const text = String(value ?? '').trim();
      let m = text.match(/^(\d{1,2})[/.\-](\d{1,2})[/.\-](\d{2,4})$/);
      if (m) {
        const year = Number(m[3]) < 100 ? 2000 + Number(m[3]) : Number(m[3]);
        return `${year}-${pad(m[2])}-${pad(m[1])}`;
      }
      m = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      return /^\d{5}(\.\d+)?$/.test(text) ? parseDateValue(Number(text)) : '';
    }

    function headerKey(header) {
      const h = norm(header);
      if (h.startsWith('motif')) return 'motif';
      if (h.includes('soin pour') || h.includes('pour qui')) return 'patient';
      if (h.startsWith('montant')) return 'amount';
      if (h.startsWith('date')) return 'date';
      if (h.includes('paye par')) return 'payer';
      if (h.includes('transmis par secu')) return 'transSecu';
      if (h.includes('transmis par nous')) return 'transUs';
      if (h.includes('mutuelle') && h.includes('rembourse')) return 'mutuelle';
      if (h.includes('secu') && h.includes('rembourse')) return 'secu';
      if (h.startsWith('emis')) return 'mutuelleDate';
      if (h.startsWith('reverse')) return 'reverse';
      if (h.startsWith('info') || h.startsWith('note') || h.startsWith('comment')) return 'notes';
      return null;
    }

    function expenseKey(date, motif, amount, patientName) {
      return [date, norm(motif), amount ?? '', norm(patientName)].join('|');
    }

    function prepareImport(rows) {
      const headerIndex = rows.findIndex(r => r.some(c => norm(c).startsWith('motif')));
      let columns = { motif: 0, patient: 1, amount: 2, date: 3, payer: 4, secu: 5, transSecu: 6, transUs: 7, mutuelle: 8, mutuelleDate: 9, reverse: 10, notes: 12 };
      if (headerIndex >= 0) {
        columns = {};
        rows[headerIndex].forEach((c, i) => {
          const key = headerKey(c);
          if (key && columns[key] === undefined) columns[key] = i;
        });
      }
      const peopleByName = new Map(data.people.map(p => [norm(p.name), p]));
      const newPeople = [];
      const resolvePerson = name => {
        const clean = String(name ?? '').trim();
        if (!clean) return '';
        let person = peopleByName.get(norm(clean));
        if (!person) {
          person = { id: uid(), name: clean, updatedAt: Date.now() };
          peopleByName.set(norm(clean), person);
          newPeople.push(person);
        }
        return person.id;
      };
      const seen = new Set(data.expenses.map(e => expenseKey(e.date, motifText(e), e.amount, personName(e.patient))));
      const isYes = value => ['x', 'oui', 'o', 'yes', 'vrai', '1'].includes(norm(value));
      const isDash = value => String(value ?? '').trim() === '-';
      const expenses = [];
      let duplicates = 0;
      const now = Date.now();
      rows.slice(headerIndex + 1).forEach(row => {
        const get = key => columns[key] === undefined ? '' : row[columns[key]] ?? '';
        const motif = String(get('motif')).trim();
        const amount = parseAmount(get('amount'));
        if (!motif && amount === null) return;
        const date = parseDateValue(get('date'));
        const key = expenseKey(date, motif, amount, get('patient'));
        if (seen.has(key)) { duplicates++; return; }
        seen.add(key);
        let secu = isDash(get('secu')) ? 0 : parseAmount(get('secu'));
        const mutuelle = isDash(get('mutuelle')) ? 0 : parseAmount(get('mutuelle'));
        if (secu === null && mutuelle !== null) secu = 0;
        const reverse = norm(get('reverse'));
        expenses.push({
          id: uid(), type: '', motif, patient: resolvePerson(get('patient')), payer: resolvePerson(get('payer')), date, amount, secu,
          transmission: isYes(get('transUs')) ? 'us' : isYes(get('transSecu')) ? 'secu' : '',
          mutuelle, mutuelleDate: parseDateValue(get('mutuelleDate')),
          reversement: reverse === 'oui' ? 'done' : reverse === 'non' ? 'todo' : 'na',
          notes: String(get('notes')).trim(), closed: false, createdAt: now, updatedAt: now
        });
      });
      const usedIds = new Set(expenses.flatMap(e => [e.patient, e.payer]));
      return { expenses, newPeople: newPeople.filter(p => usedIds.has(p.id)), duplicates };
    }

    $('importFile').addEventListener('change', async event => {
      const file = event.target.files[0];
      event.target.value = '';
      if (!file) return;
      try {
        const rows = /\.xlsx$/i.test(file.name) ? await parseXlsx(await file.arrayBuffer()) : parseDelimited(await file.text());
        importRows(rows);
      } catch (error) {
        console.error('[Suivi santé] Import impossible', error);
        showToast(error.message || 'Import impossible');
      }
    });

    function importRows(rows) {
      const { expenses, newPeople, duplicates } = prepareImport(rows);
      const dup = duplicates ? ` (${duplicates} doublon(s) ignoré(s))` : '';
      if (!expenses.length) { showToast(`Aucun nouveau soin${dup}`); return false; }
      if (!confirm(`Importer ${expenses.length} soin(s)${dup} ?`)) return false;
      data.people.push(...newPeople);
      data.expenses.push(...expenses);
      save();
      renderPeople();
      showToast(`${expenses.length} soin(s) importé(s)`);
      return true;
    }

    $('importTextBtn').addEventListener('click', () => {
      const text = $('importText').value;
      if (!text.trim()) { $('importText').focus(); showToast('Collez d’abord des lignes depuis Excel'); return; }
      if (importRows(parseDelimited(text))) $('importText').value = '';
    });

    /* ---------- Google Drive ---------- */
    let tokenClient = null;
    let accessToken = null;
    let tokenExpiresAt = 0;
    let needsAuth = false;
    let lastAuthAttempt = 0;
    let syncBusy = false;
    let syncAgain = false;
    let syncTimer = 0;
    let driveState = 'off';
    const tokenValid = () => Boolean(accessToken) && Date.now() < tokenExpiresAt;
    const driveLabels = { on: 'Connecté', busy: 'Synchro…', off: 'Non connecté', test: 'Mode test' };

    function setSync(mode, message) {
      driveState = mode;
      $('driveChip').className = `drive-chip ${mode}`;
      $('driveChipLabel').textContent = driveLabels[mode];
      $('driveChip').title = `Google Drive : ${message}`;
      $('driveStatus').textContent = driveLabels[mode];
      $('driveMessage').textContent = message;
      $('driveConnectBtn').textContent = tokenValid() ? 'Synchroniser' : 'Se connecter';
      $('driveConnectBtn').disabled = mode === 'test' || mode === 'busy';
      $('driveDisconnectBtn').hidden = !tokenValid();
    }

    function gsiReady() {
      if (TEST_MODE) return;
      if (!window.google || !google.accounts || !google.accounts.oauth2) {
        setSync('off', 'Service Google indisponible. Vérifiez la connexion Internet.');
        return;
      }
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GOOGLE_DRIVE_SCOPE,
        callback: response => {
          if (response.error) {
            setSync('off', 'Connexion refusée.');
            return;
          }
          accessToken = response.access_token;
          tokenExpiresAt = Date.now() + (Number(response.expires_in) - 60) * 1000;
          needsAuth = false;
          localStorage.setItem(DRIVE_ENABLED_KEY, '1');
          syncNow();
        },
        error_callback: () => {
          needsAuth = true;
          setSync('off', 'Reconnexion nécessaire.');
        }
      });
      if (localStorage.getItem(DRIVE_ENABLED_KEY) === '1') requestDriveToken();
      else setSync('off', 'Connectez-vous pour partager les données.');
    }

    function requestDriveToken() {
      if (!tokenClient) {
        setSync(driveState, 'Connexion Google en cours de chargement…');
        return;
      }
      lastAuthAttempt = Date.now();
      tokenClient.requestAccessToken({ prompt: '' });
    }

    $('driveConnectBtn').addEventListener('click', () => {
      if (tokenValid()) syncNow();
      else requestDriveToken();
    });

    $('driveChip').addEventListener('click', () => {
      if (driveState === 'off' && tokenClient) requestDriveToken();
      else $('settingsBtn').click();
    });

    $('driveDisconnectBtn').addEventListener('click', () => {
      if (accessToken && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(accessToken, () => {});
      accessToken = null;
      tokenExpiresAt = 0;
      needsAuth = false;
      localStorage.removeItem(DRIVE_ENABLED_KEY);
      setSync('off', 'Déconnecté. Les données restent sur cet appareil.');
    });

    function scheduleSync() {
      if (TEST_MODE || !tokenValid()) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(syncNow, 2000);
    }

    async function driveApi(url, options = {}) {
      const response = await fetch(url, { ...options, headers: { ...(options.headers || {}), Authorization: `Bearer ${accessToken}` } });
      if (response.status === 401) {
        accessToken = null;
        needsAuth = true;
        throw new Error('auth');
      }
      if (!response.ok) throw new Error(`http ${response.status}`);
      return response;
    }

    async function syncNow() {
      if (TEST_MODE) return;
      if (syncBusy) { syncAgain = true; return; }
      if (!tokenValid()) {
        needsAuth = true;
        setSync('off', 'Reconnexion nécessaire.');
        return;
      }
      syncBusy = true;
      setSync('busy', 'Synchronisation en cours…');
      try {
        const query = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
        const listing = await (await driveApi(`https://www.googleapis.com/drive/v3/files?q=${query}&orderBy=createdTime&fields=files(id)`)).json();
        const fileId = listing.files[0] ? listing.files[0].id : null;
        let merged = data;
        for (const file of listing.files) {
          const remote = await (await driveApi(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(file.id)}?alt=media`)).json();
          if (isData(remote)) merged = mergeData(merged, normalizeData(remote));
        }
        data = merged;
        persist();
        render();
        const json = JSON.stringify(data);
        if (fileId) {
          await driveApi(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(fileId)}?uploadType=media`, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: json
          });
        } else {
          const boundary = 'suivi-sante-boundary';
          await driveApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
            body: `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: 'application/json' })}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${boundary}--`
          });
        }
        setSync('on', `Synchronisé à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}.`);
      } catch (error) {
        console.error('[Suivi santé] Synchronisation Google Drive impossible', error);
        setSync('off', error.message === 'auth' ? 'Reconnexion nécessaire.' : 'Erreur de synchronisation.');
      } finally {
        syncBusy = false;
        if (syncAgain) { syncAgain = false; scheduleSync(); }
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && tokenValid()) syncNow();
    });
    document.addEventListener('pointerdown', () => {
      if (needsAuth && localStorage.getItem(DRIVE_ENABLED_KEY) === '1' && Date.now() - lastAuthAttempt > 30000) requestDriveToken();
    });
    setInterval(() => {
      if (driveState === 'on' && !tokenValid()) {
        needsAuth = true;
        setSync('off', 'Session expirée.');
      }
    }, 60000);

    /* ---------- Démarrage ---------- */
    $('testBanner').hidden = !TEST_MODE;
    setSync(TEST_MODE ? 'test' : 'off', TEST_MODE ? 'Synchronisation désactivée en mode test.' : 'Chargement du service Google…');
    render();
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="gsiReady()" onerror="gsiReady()"></script>
</body>
</html>
